const prog = (t, a, d) => clamp((t - a) / d);
function win(t, a, b, fi = .55, fo = .45) { if (t < a || t > b) return 0; return Math.min(out3(prog(t, a, fi)), 1 - prog(t, b - fo, fo)); }
function el(html, style = "", cls = "abs") { const d = document.createElement("div"); d.className = cls; d.style.cssText = style; d.innerHTML = html; S.appendChild(d); return d; }

function grain(frame) {

  gctx.putImageData(gimg, 0, 0);

// ---------- render(t): every frame is a pure function of time ----------
window.render = function (t) {
  if (!window.__grain) { grain(1); window.__grain = true; }   // static texture: animated noise made the file 240 MB
  // S1 hook 0-7
  type(s1q, "When is the launch?", t, .25, 15);
  put(s1q, win(t, 0, 7.1, .1, .5), 0, lerp(0, -10, prog(t, 5.5, 1.5)));
  s1c.forEach((c, i) => { const a = 1.7 + i * .65, p = out3(prog(t, a, .8)); put(c, Math.min(p, 1 - prog(t, 6.55, .45)), s1pos[i][0], s1pos[i][1] + 40 * (1 - p) + (t > 6.5 ? 30 * prog(t, 6.55, .45) : 0), lerp(.96, 1, p)); });
  put(s1cap, win(t, 3.9, 7.1, .7, .5), 0, 14 * (1 - out3(prog(t, 3.9, .7))));
  // S2 reveal 7-14
  const w2 = win(t, 7.35, 13.9, .9, .5);
  put(s2w, w2, 0, 18 * (1 - out3(prog(t, 7.35, 1.1))), lerp(1.04, 1, out3(prog(t, 7.35, 1.4))), 8 * (1 - out3(prog(t, 7.35, .9))));
  s2w.style.letterSpacing = `${lerp(.06, -.02, out3(prog(t, 7.35, 1.6)))}em`;
  put(s2t, win(t, 8.5, 13.9, .7, .5), 0, 12 * (1 - out3(prog(t, 8.5, .7))));
  s2s.forEach((n, i) => { const a = 9.4 + i * .18, p = out3(prog(t, a, .6)); put(n, Math.min(p, 1 - prog(t, 13.45, .45)), 0, 18 * (1 - p));
    n.firstChild.textContent = Math.round(STATS[i][0] * out3(prog(t, a, 1.3))).toString(); });
  put(s2sub, win(t, 10.9, 13.9, .6, .5));
  // S3 time travel 14-32
  const on3 = win(t, 14.15, 31.95, .6, .5);
  [s3h, s3axis, s3future, ...s3days].forEach(n => put(n, on3));
  put(s3q, on3, 0, 10 * (1 - out3(prog(t, 14.15, .6))));
  let ph = PH[0][2];
  for (const [a, b, m0, m1] of PH) { if (t >= a) ph = lerp(m0, m1, io3(prog(t, a, b - a))); }
  const px = tx(ph);
  put(s3ph, on3, px, 0);
  document.getElementById("phl").textContent = "as of " + new Date(ph - 7 * 36e5).toISOString().slice(5, 16).replace("T", " · ").replace(/^0?(\d+)-(\d+)/, (m, mo, d) => `Sep ${+d}`);
  s3future.style.left = `${px}px`; s3future.style.width = `${Math.max(0, X1 + 40 - px)}px`;
  document.getElementById("nwy").style.opacity = clamp((X1 + 40 - px - 200) / 120);   // only when the region has room
  const cited = ANS.findIndex((a, i) => t >= ANS_WIN[i][0] && t < ANS_WIN[i][1]);
  s3dots.forEach(d => { const x = tx(d.ms), past = d.ms <= ph; const hl = cited >= 0 && ANS[cited].src.some(s => s === d.r.id);
    put(d.node, on3 * (past ? 1 : .16), x - 9, TY - 8, hl ? 1.55 : 1);
    d.node.style.boxShadow = hl ? "0 0 0 4px #0d0f14, 0 0 22px #f5b14c" : "0 0 0 4px #0d0f14"; });
  s3a.forEach((n, i) => { const [a, b] = ANS_WIN[i]; const o = win(t, a, b, .5, .35) * on3; put(n, o, 0, 16 * (1 - out3(prog(t, a, .5)))); });
  put(s3histT, Math.min(on3, out3(prog(t, 21.6, .5))));
  s3hist.forEach((n, i) => { const a = i === 0 ? 21.6 : 27.2; put(n, Math.min(on3, out3(prog(t, a, .6))), -12 * (1 - out3(prog(t, a, .6)))); });
  // S4 who said what 32-44
  const on4 = win(t, 32.25, 43.95, .5, .5);
  put(s4h, on4); type(s4q, "Did John agree to cut dark mode?", t, 32.45, 26); put(s4q, on4);
  put(s4l, Math.min(on4, out3(prog(t, 34.0, .7))), 0, 24 * (1 - out3(prog(t, 34.0, .7))));
  put(s4r, Math.min(on4, out3(prog(t, 35.2, .7))), 0, 24 * (1 - out3(prog(t, 35.2, .7))));
  put(s4a, Math.min(on4, out3(prog(t, 36.8, .7))), 0, 20 * (1 - out3(prog(t, 36.8, .7))));
  // S5 what it won't say 44-57
  const on5 = win(t, 44.25, 56.95, .5, .5);
  put(s5h, on5, 0, 10 * (1 - out3(prog(t, 44.25, .6))));
  s5p.forEach((p, i) => { const a = 45.1 + i * 2.4, q = out3(prog(t, a, .8)); put(p, Math.min(on5, q), 0, 40 * (1 - q)); });
  // S6 actions 57-68
  const on6 = win(t, 57.25, 67.95, .5, .5);
  put(s6h, on6); put(s6bar, on6);
  if (t < 63.3) type(cmdNode, "Remind me an hour before the board meeting to print the deck", t, 57.6, 30);
  else type(cmdNode, "Delete all my emails from Marcus", t, 63.6, 28);
  put(s6cal, Math.min(on6, out3(prog(t, 59.9, .6))), 0, 20 * (1 - out3(prog(t, 59.9, .6))));
  const pin = out3(prog(t, 60.7, .7));
  put(s6pin, Math.min(on6, pin), 0, -60 * (1 - pin));
  put(s6out, Math.min(on6, out3(prog(t, 61.5, .6))), 0, 12 * (1 - out3(prog(t, 61.5, .6))));
  const m = Math.min(on6, out3(prog(t, 64.9, .6)));
  put(s6dim, m); put(s6modal, m, 0, 26 * (1 - out3(prog(t, 64.9, .6))), lerp(.97, 1, out3(prog(t, 64.9, .6))));
  // S7 proof and bridge 68-75
  const on7 = win(t, 68.2, 71.6, .5, .5);
  s7s.forEach((n, i) => { const a = 68.3 + i * .22, p = out3(prog(t, a, .7)); put(n, Math.min(on7, p), 0, 26 * (1 - p)); });
  put(s7f, Math.min(on7, out3(prog(t, 69.5, .6))));
  const on8 = win(t, 71.8, 75.2, .7, .3);
  put(s7w, on8, 0, 0, lerp(1.03, 1, out3(prog(t, 71.8, 1.2)))); put(s7u, Math.min(on8, out3(prog(t, 72.4, .6))));
  put(s7l, Math.min(on8, out3(prog(t, 73.1, .6))), 14 * (1 - out3(prog(t, 73.1, .6))));
};
window.ready = document.fonts.ready.then(() => true);
render(0);
</script>
